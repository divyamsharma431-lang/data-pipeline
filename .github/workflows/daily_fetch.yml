name: Daily data fetch

on:
  schedule:
    # Runs at 08:00 UTC every day. Edit the cron expression to change timing.
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          GITHUB_HABITS_USERNAME: ${{ vars.HABITS_USERNAMES ||github.repository_owner }}
        run: python -m src.ingest

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.db
          git diff --cached --quiet || git commit -m "chore: daily data refresh"
          git push
